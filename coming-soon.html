<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DoubleTap - Coming Soon</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
            background: #000000;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .container {
            text-align: center;
            padding: 40px;
            max-width: 700px;
            animation: fadeInUp 1.2s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .brand {
            font-size: 20px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 30px;
            letter-spacing: 2px;
            text-transform: uppercase;
            min-height: 24px;
        }

        .brand::after {
            content: '|';
            animation: blink 1s step-end infinite;
            margin-left: 2px;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        h1 {
            font-size: 52px;
            font-weight: 900;
            margin-bottom: 20px;
            letter-spacing: -0.03em;
            line-height: 1.1;
            background: linear-gradient(135deg, #ffffff 0%, #dc2626 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: 18px;
            color: #9ca3af;
            margin-bottom: 40px;
            font-weight: 400;
            line-height: 1.6;
            max-width: 550px;
            margin-left: auto;
            margin-right: auto;
        }

        .status-bar {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: rgba(220, 38, 38, 0.1);
            border: 1px solid rgba(220, 38, 38, 0.3);
            padding: 14px 28px;
            border-radius: 100px;
            font-size: 14px;
            font-weight: 600;
            color: #dc2626;
            margin-bottom: 50px;
        }

        .countdown {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .countdown-item {
            background: rgba(255, 255, 255, 0.02);
            padding: 20px 25px;
            border-radius: 12px;
            min-width: 90px;
            border: 1px solid rgba(220, 38, 38, 0.1);
        }

        .countdown-number {
            font-size: 36px;
            font-weight: 900;
            color: #dc2626;
            display: block;
            margin-bottom: 8px;
            font-variant-numeric: tabular-nums;
        }

        .countdown-label {
            font-size: 11px;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 600;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background: #dc2626;
            border-radius: 50%;
            animation: pulse-dot 2s ease-in-out infinite;
            box-shadow: 0 0 10px rgba(220, 38, 38, 0.5);
        }

        @keyframes pulse-dot {
            0%, 100% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(1.2);
                opacity: 0.7;
            }
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 36px;
            }

            .subtitle {
                font-size: 16px;
            }

            .brand {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="brand" id="brand-text"></div>
        <h1>Coming Soon</h1>
        <p class="subtitle">We're crafting something extraordinary. A next-generation platform designed for performance, security, and simplicity.</p>
        
        <div class="countdown">
            <div class="countdown-item">
                <span class="countdown-number" id="days">00</span>
                <span class="countdown-label">Days</span>
            </div>
            <div class="countdown-item">
                <span class="countdown-number" id="hours">00</span>
                <span class="countdown-label">Hours</span>
            </div>
            <div class="countdown-item">
                <span class="countdown-number" id="minutes">00</span>
                <span class="countdown-label">Minutes</span>
            </div>
            <div class="countdown-item">
                <span class="countdown-number" id="seconds">00</span>
                <span class="countdown-label">Seconds</span>
            </div>
        </div>

        <div class="status-bar">
            <span class="status-dot"></span>
            <span>BUILDING IN PROGRESS</span>
        </div>
    </div>

    <script>
        // Typewriter effect for brand name
        const brandText = 'DOUBLETAP.CC';
        const brandElement = document.getElementById('brand-text');
        let charIndex = 0;

        function typeWriter() {
            if (charIndex < brandText.length) {
                brandElement.textContent = brandText.substring(0, charIndex + 1);
                charIndex++;
                setTimeout(typeWriter, 100);
            } else {
                // Remove cursor after typing is complete
                setTimeout(() => {
                    brandElement.style.setProperty('--cursor-display', 'none');
                }, 500);
            }
        }

        // Start typing animation after page loads
        setTimeout(typeWriter, 500);

        // Countdown Timer - June 20, 2026 at 2:00 PM
        const launchDate = new Date('2026-06-20T14:00:00').getTime();

        function updateCountdown() {
            const now = new Date().getTime();
            const distance = launchDate - now;

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById('days').textContent = String(days).padStart(2, '0');
            document.getElementById('hours').textContent = String(hours).padStart(2, '0');
            document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
            document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');

            if (distance < 0) {
                clearInterval(countdownInterval);
                document.querySelector('.countdown').innerHTML = '<h2 style="color: #dc2626; font-size: 32px; font-weight: 900;">We\'re Live!</h2>';
            }
        }

        const countdownInterval = setInterval(updateCountdown, 1000);
        updateCountdown();
    </script>
